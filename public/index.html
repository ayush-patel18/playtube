<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayTube</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="hl">
    <button class="ib" id="burger" aria-label="Guide"></button>
    <a class="logo" href="#/" aria-label="PlayTube home"><b><i></i></b><span>PlayTube</span></a>
  </div>
  <div class="sb">
    <div class="sbox">
      <input id="q" type="search" placeholder="Search" aria-label="Search" autocomplete="off">
      <button id="go" aria-label="Search"></button>
    </div>
    <button class="ib mic" id="mic" aria-label="Search with your voice"></button>
  </div>
  <div class="hr">
    <button class="ib" id="theme" aria-label="Toggle theme"></button>
    <button class="ib cr" data-toast="Uploading isn't available in this demo" aria-label="Create"></button>
    <button class="ib" data-toast="You have no new notifications" aria-label="Notifications"></button>
    <button class="me" id="me" aria-label="Account" style="border:0;cursor:pointer;font:500 14px Roboto,sans-serif">G</button>
  </div>
</header>
<nav class="side" id="side" aria-label="Guide"></nav>
<div class="ov" id="ov"></div>
<main id="main"></main>
<div id="menu"></div>
<dialog id="auth" aria-labelledby="at">
  <h2 id="at">Your account</h2>
  <p id="ainfo"></p>
  <input id="au" placeholder="Username" autocomplete="username" aria-label="Username">
  <input id="ap" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
  <p id="ae" role="alert"></p>
  <div class="ca"><button class="pill" id="aout" hidden>Sign out</button><button class="pill" id="acl">Close</button><button class="pill" id="areg">Create account</button><button class="pill blue" id="alog">Sign in</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="js/app.js" defer></script>
</body>
</html>
